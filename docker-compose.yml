version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: doto-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: doto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d doto"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doto-backend
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5432/doto
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: doto-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
